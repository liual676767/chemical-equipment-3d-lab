<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>验收 · 流体几何量化检查</title>
  <style>body { margin: 0; background: #0b131b; color: #dfeaf5; font: 13px/1.5 "Microsoft YaHei", sans-serif; } #status { padding: 8px 12px; }</style>
</head>
<body>
  <div id="status">loading…</div>
  <script type="module">
    import * as THREE from 'three';
    import { BOIL_PROCESS } from '/src/data/boilProcess.ts';
    import { BOIL_KEEPOUTS, BOIL_LAYOUT } from '/src/data/boilLayout.ts';
    import { BOIL_MODELS, getBoilModelBounds } from '/src/engine/boilModels.ts';
    import { validatePiping } from '/src/process/piping.ts';
    import { computeBoilFluid } from '/src/process/fluid.ts';
    import { createBoilFluidOverlay } from '/src/engine/boilFluid.ts';

    const statusEl = document.getElementById('status');
    const errors = [];
    window.addEventListener('error', (e) => errors.push(String(e.message)));
    window.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));

    const specs = {};
    for (const key of Object.keys(BOIL_MODELS)) {
      specs[key] = {
        key,
        bbox: getBoilModelBounds(key),
        ports: BOIL_MODELS[key].ports.map((p) => ({ id: p.id, pos: p.pos, dir: p.dir, size: p.size, role: p.role, media: p.media, boundary: p.boundary }))
      };
    }
    const piping = validatePiping(BOIL_PROCESS, (key) => specs[key], {}, BOIL_LAYOUT);
    const mediumColors = Object.fromEntries(BOIL_PROCESS.media.map((m) => [m.id, m.color]));
    const overlay = createBoilFluidOverlay(piping.routes, mediumColors);
    overlay.setFlows(computeBoilFluid(BOIL_PROCESS, piping.routes, {}).flows);
    for (let i = 0; i < 20; i++) overlay.update(0.033);

    const runs = overlay.runs;

    function particleDeviation(run) {
      const samples = [];
      const N = 2400;
      const p = new THREE.Vector3();
      for (let i = 0; i <= N; i++) {
        run.curve.getPointAt(Math.min(1, i / N), p);
        samples.push(p.clone());
      }
      const attr = run.points.geometry.getAttribute('position');
      let maxDev = 0;
      let maxOff = 0;
      const q = new THREE.Vector3();
      for (let i = 0; i < attr.count; i++) {
        q.set(attr.getX(i), attr.getY(i), attr.getZ(i));
        let best = Infinity;
        for (const s of samples) {
          const d = q.distanceToSquared(s);
          if (d < best) best = d;
        }
        maxDev = Math.max(maxDev, Math.sqrt(best));
      }
      return { pipelineId: run.pipelineId, radius: run.radius, maxDev: Number(maxDev.toFixed(4)), excess: Number((maxDev - run.radius).toFixed(4)) };
    }

    function snapshotFlow() {
      return Object.fromEntries(Object.entries(computeBoilFluid(BOIL_PROCESS, piping.routes, window.__valveStates ?? {}).flows).map(([id, f]) => [id, { state: f.state, throttle: Boolean(f.throttle), haltT: f.haltT }]));
    }

    window.__geoTest = {
      ready: true,
      errors,
      counts: piping.counts,
      routeCount: piping.routes.length,
      runCount: runs.length,
      deviation(scope) {
        const list = scope ? runs.filter((r) => r.pipelineId === scope) : runs;
        return list.map(particleDeviation);
      },
      setValve(pipelineId, state) {
        window.__valveStates = { ...(window.__valveStates ?? {}), [pipelineId]: state };
        const flows = computeBoilFluid(BOIL_PROCESS, piping.routes, window.__valveStates).flows;
        overlay.setFlows(flows);
        for (let i = 0; i < 5; i++) overlay.update(0.033);
        return snapshotFlow();
      },
      resetValves() {
        window.__valveStates = {};
        overlay.setFlows(computeBoilFluid(BOIL_PROCESS, piping.routes, {}).flows);
        for (let i = 0; i < 5; i++) overlay.update(0.033);
        return snapshotFlow();
      },
      pauseProbe(pipelineId) {
        overlay.setPaused(false);
        const before = overlay.stats().perRun.find((r) => r.pipelineId === pipelineId)?.progress;
        overlay.update(0.2);
        const moving = overlay.stats().perRun.find((r) => r.pipelineId === pipelineId)?.progress;
        overlay.setPaused(true);
        overlay.update(0.2);
        overlay.update(0.2);
        const frozen = overlay.stats().perRun.find((r) => r.pipelineId === pipelineId)?.progress;
        overlay.setPaused(false);
        return { before, moving, frozen, advanced: moving !== before, frozenStable: frozen === moving };
      },
      particleSnapshot(pipelineId) {
        const run = runs.find((r) => r.pipelineId === pipelineId);
        const attr = run.points.geometry.getAttribute('position');
        return Array.from({ length: attr.count * 3 }, (_, i) => Number(attr.array[i].toFixed(5)));
      }
    };
    statusEl.textContent = `ready · routes=${piping.routes.length} runs=${runs.length}`;
    document.body.dataset.ready = '1';
  </script>
</body>
</html>
