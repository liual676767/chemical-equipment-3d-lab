<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>微沸喷烧 Phase 4 · 流体教学示意预览</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d141c; color: #d7e2ee; }
    body { font: 13px/1.5 "Microsoft YaHei", system-ui, sans-serif; }
    #view { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; left: 16px; top: 16px; width: 510px; max-height: calc(100vh - 32px);
      overflow: auto; padding: 14px 16px; border: 1px solid rgba(120, 160, 200, .35);
      border-radius: 10px; background: rgba(8, 14, 21, .88); backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
    }
    #hud h1 { margin: 0 0 4px; font-size: 16px; letter-spacing: .02em; color: #f0f6fc; }
    #hud h2 { margin: 12px 0 4px; font-size: 13px; color: #9fb8d0; font-weight: 600; }
    #hud p { margin: 4px 0; color: #9fb1c4; }
    #hud .warn { color: #e0b86a; }
    #hud .good { color: #7fd8a3; }
    #hud .bad { color: #e88484; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 4px; color: #b9c9da; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .dot.material { background: #3f7fbf; }
    .dot.gas { background: #8a95a3; }
    .dot.open { background: #34d399; }
    .dot.partial { background: #fbbf24; }
    .dot.closed { background: #f87171; }
    .controls { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .controls button, .valve-btns button {
      border: 1px solid rgba(120, 160, 200, .35); background: rgba(20, 30, 42, .9);
      color: #cfdcea; border-radius: 6px; padding: 3px 9px; font: inherit; font-size: 12px; cursor: pointer;
    }
    .controls button:hover, .valve-btns button:hover { border-color: rgba(150, 200, 250, .7); }
    .controls button.on, .valve-btns button.on { background: rgba(52, 150, 220, .28); border-color: rgba(120, 200, 255, .8); color: #f2f8ff; }
    .valve-btns { white-space: nowrap; }
    .valve-btns button { padding: 1px 6px; font-size: 11px; }
    table { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 11.5px; }
    th, td { text-align: left; padding: 2px 5px; border-bottom: 1px solid rgba(120, 160, 200, .14); vertical-align: middle; }
    th { color: #8fa6bc; font-weight: 500; }
    code { color: #cfe1f3; }
    #status { position: fixed; right: 16px; bottom: 14px; padding: 6px 10px; border-radius: 6px; background: rgba(8, 14, 21, .82); color: #9fb1c4; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">
    <h1>微沸喷烧 Phase 4 · 流体教学示意</h1>
    <p>18 个设备实例 · 13 条管线 · 示踪粒子 + 流向箭头 + 阀门状态联动</p>
    <p class="warn">内部验证预览，未接入站点路由。粒子/箭头只表示流向与通断，不表示温度、压力、流量或停留时间；两条流线独立传播，未建立物料—烟气耦合。</p>
    <div class="legend">
      <span><i class="dot material"></i>物料流</span>
      <span><i class="dot gas"></i>烟气流</span>
      <span><i class="dot open"></i>阀开</span>
      <span><i class="dot partial"></i>部分开度</span>
      <span><i class="dot closed"></i>阀关</span>
    </div>
    <div class="controls">
      <button type="button" data-action="pause">暂停</button>
      <button type="button" data-action="speed" data-speed="0.5">0.5×</button>
      <button type="button" data-action="speed" data-speed="1" class="on">1×</button>
      <button type="button" data-action="speed" data-speed="2">2×</button>
      <button type="button" data-action="arrows" class="on">箭头开</button>
      <button type="button" data-action="all-open">全部开启</button>
      <button type="button" data-action="all-closed">全部关闭</button>
      <button type="button" data-action="view" data-view="overview" class="on">整线</button>
      <button type="button" data-action="view" data-view="material">物料段</button>
      <button type="button" data-action="view" data-view="gas">烟气段</button>
      <button type="button" data-action="view" data-view="valve">阀近景</button>
    </div>
    <div id="summary"></div>
  </div>
  <div id="status">加载中…</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { BOIL_MODELS, BOIL_MODEL_KEYS, buildBoilModel, getBoilModelBounds } from '/src/engine/boilModels.ts';
    import { BOIL_PROCESS } from '/src/data/boilProcess.ts';
    import { BOIL_LAYOUT, BOIL_KEEPOUTS, BOIL_LAYOUT_NOTE } from '/src/data/boilLayout.ts';
    import { validatePiping, BOIL_PIPE_SIZES } from '/src/process/piping.ts';
    import { computeBoilFluid } from '/src/process/fluid.ts';
    import { buildPipingRoutes } from '/src/engine/boilPiping.ts';
    import { createBoilFluidOverlay } from '/src/engine/boilFluid.ts';

    const statusEl = document.getElementById('status');
    const summaryEl = document.getElementById('summary');
    const errors = [];

    const modelSpecs = {};
    for (const key of BOIL_MODEL_KEYS) {
      modelSpecs[key] = {
        key,
        bbox: getBoilModelBounds(key),
        ports: BOIL_MODELS[key].ports.map((port) => ({
          id: port.id,
          pos: port.pos,
          dir: port.dir,
          size: port.size,
          role: port.role,
          media: port.media,
          boundary: port.boundary
        }))
      };
    }
    const piping = validatePiping(BOIL_PROCESS, (key) => modelSpecs[key], {}, BOIL_LAYOUT, BOIL_KEEPOUTS);
    if (piping.errors.length > 0) errors.push(...piping.errors.map((error) => `[${error.code}] ${error.message}`));
    const mediumColors = Object.fromEntries(BOIL_PROCESS.media.map((medium) => [medium.id, medium.color]));
    const mediumLabels = Object.fromEntries(BOIL_PROCESS.media.map((medium) => [medium.id, medium.label]));
    const valveKinds = Object.fromEntries(BOIL_PROCESS.pipelines.map((pipe) => [pipe.id, pipe.route?.valve.kind ?? '']));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d141c);
    scene.fog = new THREE.Fog(0x0d141c, 120, 320);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 800);
    const canvas = document.getElementById('view');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    scene.add(new THREE.HemisphereLight(0xbfd6ff, 0x2a3038, 1.15));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.35);
    keyLight.position.set(30, 48, 26);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 220;
    keyLight.shadow.camera.left = -70;
    keyLight.shadow.camera.right = 70;
    keyLight.shadow.camera.top = 60;
    keyLight.shadow.camera.bottom = -60;
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x88aaff, 0.7);
    fillLight.position.set(-40, 24, -30);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(0xffd7a0, 0.4);
    rimLight.position.set(0, 18, -60);
    scene.add(rimLight);

    const grid = new THREE.GridHelper(150, 75, 0x3a4c60, 0x263342);
    grid.position.set(40, -0.01, 0);
    scene.add(grid);

    function makeLabel(text, color = '#d7e2ee', scale = 1) {
      const pad = 16;
      const font = 44;
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      ctx.font = `600 ${font}px "Microsoft YaHei", sans-serif`;
      const width = Math.ceil(ctx.measureText(text).width + pad * 2);
      c.width = width;
      c.height = font + pad * 2;
      const ctx2 = c.getContext('2d');
      ctx2.font = `600 ${font}px "Microsoft YaHei", sans-serif`;
      ctx2.fillStyle = 'rgba(8, 14, 21, .78)';
      ctx2.fillRect(0, 0, c.width, c.height);
      ctx2.fillStyle = color;
      ctx2.textBaseline = 'middle';
      ctx2.fillText(text, pad, c.height / 2);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      const material = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set((c.width / c.height) * 0.5 * scale, 0.5 * scale, 1);
      sprite.renderOrder = 20;
      return sprite;
    }

    const root = new THREE.Group();
    scene.add(root);
    const labelRoot = new THREE.Group();
    scene.add(labelRoot);

    const equipmentRoot = new THREE.Group();
    for (const eq of piping.world.equipment) {
      const model = buildBoilModel(eq.modelKey);
      model.position.set(eq.modelOffset[0], eq.modelOffset[1], eq.modelOffset[2]);
      const holder = new THREE.Group();
      holder.position.set(eq.position[0], eq.position[1], eq.position[2]);
      holder.rotation.y = eq.rotationY;
      holder.userData.equipmentId = eq.equipmentId;
      holder.add(model);
      equipmentRoot.add(holder);

      const label = makeLabel(`${eq.name} · ${eq.equipmentId}`, '#f0f6fc', 0.92);
      label.position.set(
        (eq.modelBox.min[0] + eq.modelBox.max[0]) / 2,
        eq.modelBox.max[1] + 0.7,
        (eq.modelBox.min[2] + eq.modelBox.max[2]) / 2
      );
      labelRoot.add(label);
    }
    root.add(equipmentRoot);

    const pipingBuild = buildPipingRoutes(piping.routes, mediumColors);
    root.add(pipingBuild.group);
    const fluid = createBoilFluidOverlay(piping.routes, mediumColors);
    root.add(fluid.group);

    for (const route of piping.routes) {
      let best = null;
      for (const seg of route.segments) {
        if (!best || seg.length > best.length) best = seg;
      }
      if (!best) continue;
      const mid = [
        (best.from[0] + best.to[0]) / 2,
        (best.from[1] + best.to[1]) / 2,
        (best.from[2] + best.to[2]) / 2
      ];
      const label = makeLabel(`${route.pipelineId} · ${mediumLabels[route.medium] ?? route.medium}`, '#dfeaf5', 0.8);
      label.position.set(mid[0], mid[1] + 0.4, mid[2]);
      labelRoot.add(label);
    }

    const valvePickables = [];
    pipingBuild.group.traverse((obj) => {
      if (!obj.isMesh) return;
      let owner = obj;
      while (owner && !owner.userData.valveId) owner = owner.parent;
      if (owner) {
        obj.userData.valveOwner = owner.userData.valveId;
        valvePickables.push(obj);
      }
    });

    let valveStates = {};
    let snapshot = computeBoilFluid(BOIL_PROCESS, piping.routes, valveStates);
    fluid.setFlows(snapshot.flows);

    function valveStateButtons(pipelineId, state) {
      const options = [
        ['open', '开'],
        ['partial', '半'],
        ['closed', '关']
      ];
      return options.map(([value, label]) => `<button type="button" data-state="${value}" class="${state === value ? 'on' : ''}">${label}</button>`).join('');
    }

    function refreshSummary() {
      const rows = piping.routes.map((route) => {
        const state = valveStates[route.pipelineId] ?? 'open';
        const flow = snapshot.flows[route.pipelineId];
        const flowText = flow?.state === 'halt' ? '停止' : flow?.state === 'off' ? '断流' : flow?.throttle ? '节流' : '流动';
        return `<tr data-pipeline="${route.pipelineId}">
          <td><code>${route.pipelineId}</code></td>
          <td>${valveKinds[route.pipelineId] === 'gate' ? '闸阀' : '蝶阀'}</td>
          <td>${flowText}</td>
          <td class="valve-btns">${valveStateButtons(route.pipelineId, state)}</td>
        </tr>`;
      }).join('');
      const pending = snapshot.unsuppliedEquipment.length;
      const good = snapshot.counts.halt === 0 && snapshot.counts.off === 0;
      summaryEl.innerHTML = `
        <div><strong>${snapshot.counts.pipelines}</strong> 条管线 · <strong>${snapshot.counts.valves}</strong> 个示意阀 · <strong>${snapshot.streams.length}</strong> 条独立教学流线</div>
        <div class="${good ? 'good' : 'warn'}">流动 ${snapshot.counts.full - snapshot.counts.throttle} · 节流 ${snapshot.counts.throttle} · 停止 ${snapshot.counts.halt} · 断流 ${snapshot.counts.off}</div>
        <div>供料设备 ${snapshot.counts.suppliedEquipment}/18 · 未供料 ${pending}（四根喷枪保持待确认，不接入流线）</div>
        <h2>阀门状态（点击三维阀门也可切换）</h2>
        <table>
          <thead><tr><th>管线</th><th>阀型</th><th>流动</th><th>状态</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <p style="margin-top:8px">${BOIL_LAYOUT_NOTE}</p>
        <p class="warn">全开时全部 13 条管线流动；关闭某阀：本管在阀位停止、同流线下游断流；部分开度：本管与同流线下游减速。两条流线独立，未建立物料—烟气耦合。</p>
      `;
    }

    function applyValveStates() {
      snapshot = computeBoilFluid(BOIL_PROCESS, piping.routes, valveStates);
      fluid.setFlows(snapshot.flows);
      refreshSummary();
    }

    function setValve(pipelineId, state) {
      if (!['open', 'partial', 'closed'].includes(state)) return;
      if (!piping.routes.some((route) => route.pipelineId === pipelineId)) return;
      valveStates[pipelineId] = state;
      applyValveStates();
    }

    function setAll(state) {
      valveStates = Object.fromEntries(piping.routes.map((route) => [route.pipelineId, state]));
      applyValveStates();
    }

    summaryEl.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-state]');
      if (!button) return;
      const row = button.closest('tr[data-pipeline]');
      if (!row) return;
      setValve(row.dataset.pipeline, button.dataset.state);
    });

    document.querySelector('.controls').addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      const action = button.dataset.action;
      if (action === 'pause') {
        const paused = !fluid.stats().paused;
        fluid.setPaused(paused);
        button.textContent = paused ? '继续' : '暂停';
        button.classList.toggle('on', paused);
      } else if (action === 'speed') {
        const speed = Number(button.dataset.speed);
        fluid.setSpeed(speed);
        for (const other of document.querySelectorAll('.controls button[data-action="speed"]')) {
          other.classList.toggle('on', other === button);
        }
      } else if (action === 'arrows') {
        const enabled = !fluid.stats().arrowsEnabled;
        fluid.setArrowsVisible(enabled);
        button.classList.toggle('on', enabled);
        button.textContent = enabled ? '箭头开' : '箭头关';
      } else if (action === 'all-open') {
        setAll('open');
      } else if (action === 'all-closed') {
        setAll('closed');
      } else if (action === 'view') {
        setView(button.dataset.view);
      }
    });

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let downAt = null;
    canvas.addEventListener('pointerdown', (event) => {
      downAt = { x: event.clientX, y: event.clientY };
    });
    canvas.addEventListener('pointerup', (event) => {
      if (!downAt || Math.hypot(event.clientX - downAt.x, event.clientY - downAt.y) > 5) return;
      downAt = null;
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(valvePickables, false);
      if (hits.length === 0) return;
      const valveId = hits[0].object.userData.valveOwner;
      const pipelineId = String(valveId).replace(/^valve-/, '');
      const order = ['open', 'partial', 'closed'];
      const current = valveStates[pipelineId] ?? 'open';
      setValve(pipelineId, order[(order.indexOf(current) + 1) % order.length]);
    });

    const sizingBox = new THREE.Box3().setFromObject(root);
    const center = sizingBox.getCenter(new THREE.Vector3());
    const size = sizingBox.getSize(new THREE.Vector3());
    const radius = Math.max(size.x, size.y, size.z, 8);
    const target = center.clone();
    target.x -= size.x * 0.075;
    controls.target.copy(target);
    camera.position.copy(target).add(new THREE.Vector3(radius * 0.52 * 0.82, radius * 0.42 * 0.82, radius * 0.92 * 0.82));
    camera.near = Math.max(0.08, radius / 400);
    camera.far = Math.max(600, radius * 9);
    camera.updateProjectionMatrix();
    controls.update();

    const overviewTarget = controls.target.clone();
    const overviewPosition = camera.position.clone();
    let currentView = 'overview';

    function equipmentBox(minX, maxX) {
      const box = new THREE.Box3();
      for (const eq of piping.world.equipment) {
        const cx = (eq.modelBox.min[0] + eq.modelBox.max[0]) / 2;
        if (cx < minX || cx > maxX) continue;
        box.expandByPoint(new THREE.Vector3(eq.modelBox.min[0], eq.modelBox.min[1], eq.modelBox.min[2]));
        box.expandByPoint(new THREE.Vector3(eq.modelBox.max[0], eq.modelBox.max[1], eq.modelBox.max[2]));
      }
      return box;
    }

    function frameBox(box) {
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const radius = Math.max(size.x, size.y, size.z, 4);
      controls.target.copy(center);
      camera.position.copy(center).add(new THREE.Vector3(radius * 0.52, radius * 0.42, radius * 0.92));
      camera.near = Math.max(0.08, radius / 400);
      camera.far = Math.max(600, radius * 9);
      camera.updateProjectionMatrix();
      controls.update();
    }

    function setView(view) {
      currentView = view;
      labelRoot.visible = view !== 'valve';
      if (view === 'overview') {
        controls.target.copy(overviewTarget);
        camera.position.copy(overviewPosition);
        camera.updateProjectionMatrix();
        controls.update();
      } else if (view === 'material') {
        frameBox(equipmentBox(-2, 22));
      } else if (view === 'gas') {
        frameBox(equipmentBox(20, 90));
      } else if (view === 'valve') {
        const route = piping.routes.find((candidate) => candidate.pipelineId === 'pipe-material-02');
        if (route && route.valves[0]) {
          const point = new THREE.Vector3(route.valves[0].point[0], route.valves[0].point[1], route.valves[0].point[2]);
          frameBox(new THREE.Box3().setFromCenterAndSize(point, new THREE.Vector3(4, 3, 4)));
        }
      }
      for (const button of document.querySelectorAll('.controls button[data-action="view"]')) {
        button.classList.toggle('on', button.dataset.view === view);
      }
      if (window.__boilFluid) window.__boilFluid.view = view;
    }

    refreshSummary();

    const routeReports = piping.routes.map((route) => ({
      pipelineId: route.pipelineId,
      medium: route.medium,
      size: route.size,
      fromPortKey: route.fromPortKey,
      toPortKey: route.toPortKey,
      length: Number(route.length.toFixed(3)),
      elbows: route.bends.length,
      valveKind: valveKinds[route.pipelineId],
      supports: route.supports.length
    }));

    window.__boilFluid = {
      ready: false,
      mode: 'fluid',
      view: currentView,
      layoutNote: BOIL_LAYOUT_NOTE,
      counts: {
        pipelines: piping.counts.routedPipelines,
        equipment: piping.world.equipment.length,
        valves: fluid.descriptors().length,
        particles: fluid.stats().particles,
        arrows: fluid.stats().arrows
      },
      pipingCounts: piping.counts,
      fluidCounts: snapshot.counts,
      flows: snapshot.flows,
      suppliedEquipment: snapshot.suppliedEquipment,
      unsuppliedEquipment: snapshot.unsuppliedEquipment,
      streams: snapshot.streams,
      runs: fluid.descriptors(),
      routes: routeReports,
      valveStates: { ...valveStates },
      runtime: fluid.stats(),
      errorCount: piping.errors.length,
      errors: piping.errors,
      pageErrors: errors,
      actions: {
        setValve,
        setAll,
        setPaused: (paused) => fluid.setPaused(Boolean(paused)),
        setSpeed: (speed) => fluid.setSpeed(Number(speed)),
        setArrows: (enabled) => fluid.setArrowsVisible(Boolean(enabled)),
        setView,
        isPaused: () => fluid.stats().paused,
        stats: () => fluid.stats(),
        speed: () => fluid.stats().speed,
        progress: (pipelineId) => {
          const run = fluid.stats().perRun.find((item) => item.pipelineId === pipelineId);
          return run ? run.progress : -1;
        },
        projectValve: (pipelineId) => {
          const route = piping.routes.find((candidate) => candidate.pipelineId === pipelineId);
          if (!route || !route.valves[0]) return null;
          camera.updateMatrixWorld(true);
          const v = new THREE.Vector3(route.valves[0].point[0], route.valves[0].point[1], route.valves[0].point[2]).project(camera);
          return { x: ((v.x + 1) / 2) * innerWidth, y: ((1 - v.y) / 2) * innerHeight, visible: v.z < 1 };
        }
      }
    };

    let frames = 0;
    let lastTime = performance.now();
    function tick(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      controls.update();
      fluid.update(dt);
      renderer.render(scene, camera);
      frames += 1;
      window.__boilFluid.runtime = fluid.stats();
      if (frames % 10 === 0) {
        window.__boilFluid.fluidCounts = snapshot.counts;
        window.__boilFluid.flows = snapshot.flows;
        window.__boilFluid.suppliedEquipment = snapshot.suppliedEquipment;
        window.__boilFluid.unsuppliedEquipment = snapshot.unsuppliedEquipment;
        window.__boilFluid.valveStates = { ...valveStates };
      }
      if (frames === 3) {
        statusEl.textContent = `渲染完成 · ${piping.counts.routedPipelines} 条管线 · ${snapshot.counts.full} 条流动 · 阀 ${snapshot.counts.valves}`;
        window.__boilFluid.ready = true;
        window.__boilFluid.runtime = fluid.stats();
        document.body.dataset.previewReady = '1';
      }
      requestAnimationFrame(tick);
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    requestAnimationFrame(tick);
  </script>
</body>
</html>
