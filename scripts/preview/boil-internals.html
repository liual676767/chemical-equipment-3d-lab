<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>微沸喷烧 Phase 7 · 核心设备内部结构预览</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d141c; color: #d7e2ee; }
    body { font: 13px/1.55 "Microsoft YaHei", system-ui, sans-serif; }
    #view { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; left: 16px; top: 16px; width: 590px; max-height: calc(100vh - 32px);
      overflow: auto; padding: 14px 16px 16px; border: 1px solid rgba(120, 160, 200, .32);
      border-radius: 10px; background: rgba(8, 14, 21, .9); backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
    }
    #hud h1 { margin: 0 0 4px; font-size: 16px; letter-spacing: .02em; color: #f0f6fc; }
    #hud h2 { margin: 12px 0 6px; font-size: 12.5px; color: #9fb8d0; font-weight: 600; letter-spacing: .03em; }
    #hud p { margin: 4px 0; color: #9fb1c4; }
    .tag { display: inline-block; padding: 0 7px; border-radius: 999px; border: 1px solid rgba(127, 216, 163, .45); color: #7fd8a3; font-size: 11px; margin-right: 6px; }
    .warn { color: #e0b86a; }
    .bad { color: #e88484; }
    .good { color: #7fd8a3; }
    .muted { color: #7f93a8; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .equipment-list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 128px; overflow: auto; padding-right: 2px; }
    .equipment-list button, .mode-list button, .part-row, .mini-btn {
      font: inherit; color: #c6d5e5; background: rgba(30, 45, 62, .72); border: 1px solid rgba(110, 145, 180, .28);
      border-radius: 6px; cursor: pointer; padding: 3px 8px; transition: border-color .15s, background .15s;
    }
    .equipment-list button:hover, .mode-list button:hover, .part-row:hover { border-color: rgba(120, 185, 245, .7); }
    .equipment-list button.active, .mode-list button.active { background: rgba(43, 103, 163, .48); border-color: #5da8ef; color: #eaf5ff; }
    .equipment-list button small { color: #7f93a8; margin-left: 4px; }
    .mode-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .mode-list button { padding: 5px 10px; }
    .mode-list button b { font-weight: 600; }
    .mode-list button small { color: #8199b1; margin-left: 5px; font-size: 10px; letter-spacing: .04em; }
    .tree { max-height: 250px; overflow: auto; border: 1px solid rgba(110, 145, 180, .16); border-radius: 8px; padding: 6px 8px; background: rgba(13, 22, 32, .55); }
    .tree-group { margin: 4px 0 6px; }
    .tree-group > span { display: block; color: #8fa6bc; font-size: 11.5px; margin: 5px 0 3px; letter-spacing: .04em; }
    .part-row { display: block; width: 100%; text-align: left; margin: 2px 0; padding: 3px 7px; }
    .part-row.active { background: rgba(43, 103, 163, .42); border-color: #5da8ef; }
    .part-row .kind { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: #8fa6bc; }
    .part-row .kind.shell { background: #8fa6bc; }
    .part-row .kind.liner { background: #b0714f; }
    .part-row .kind.internal { background: #6fb3d9; }
    .part-row .kind.drive { background: #d8a84f; }
    .part-row .kind.gun { background: #e0766b; }
    .part-row .kind.flow { background: #6fd8b8; }
    .part-row .kind.duct { background: #9d8fd8; }
    .part-row .pending { color: #e0b86a; font-size: 10.5px; margin-left: 5px; }
    #detail { border: 1px solid rgba(110, 145, 180, .22); border-radius: 8px; padding: 8px 10px; background: rgba(16, 27, 40, .6); min-height: 84px; }
    #detail .name { color: #eaf5ff; font-weight: 600; }
    #detail .meta { color: #8fa6bc; font-size: 11.5px; margin: 2px 0 4px; }
    #detail .note { color: #b9c9da; }
    .status { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; margin-left: 6px; border: 1px solid rgba(224, 184, 106, .5); color: #e0b86a; }
    .status.ok { border-color: rgba(127, 216, 163, .45); color: #7fd8a3; }
    #notes { font-size: 12px; color: #93a7bb; }
    #notes p { margin: 5px 0; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 8px; color: #9fb1c4; }
    .toolbar label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
    .toolbar input { accent-color: #5da8ef; }
    .mini-btn { padding: 3px 9px; }
    #stats {
      position: fixed; right: 16px; bottom: 14px; max-width: 420px; padding: 8px 11px; border-radius: 8px;
      border: 1px solid rgba(120, 160, 200, .28); background: rgba(8, 14, 21, .86); color: #9fb1c4; font-size: 12px;
    }
    #stats b { color: #d7e2ee; font-weight: 600; }
    #status { position: fixed; right: 16px; top: 14px; padding: 5px 10px; border-radius: 6px; background: rgba(8, 14, 21, .82); color: #9fb1c4; }
    kbd { border: 1px solid rgba(120, 160, 200, .35); border-radius: 4px; padding: 0 4px; color: #b9c9da; font-size: 11px; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">
    <h1>Phase 7 · 核心设备内部结构 <span class="tag">教学示意</span></h1>
    <p class="warn">内部验证预览，未接入站点路由；全部内部结构为参数化教学示意，不是设备图纸、制造依据或现场内部结构。</p>

    <div class="section-head"><h2>设备（18 个流程实例 · 14 类教学模型）</h2><span class="muted" id="equipmentCount"></span></div>
    <div class="equipment-list" id="equipmentList"></div>

    <h2>观察模式（五种）</h2>
    <div class="mode-list" id="modeList"></div>

    <h2>结构树</h2>
    <div class="tree" id="partTree"></div>

    <h2>部件说明</h2>
    <div id="detail"><p class="muted">点击结构树或三维部件查看教学说明。</p></div>

    <div class="toolbar">
      <label><input type="checkbox" id="labelsToggle" /> 部件标签</label>
      <label><input type="checkbox" id="animToggle" checked /> 教学动画</label>
      <button class="mini-btn" id="resetView">重置视角</button>
      <span class="muted">拖动旋转 · 滚轮缩放 · 点击部件选择</span>
    </div>

    <div id="notes"></div>
  </div>

  <div id="status">加载中…</div>
  <div id="stats"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { BOIL_PROCESS } from '/src/data/boilProcess.ts';
    import { BOIL_INTERNALS, OBSERVATION_MODES } from '/src/data/boilInternals.ts';
    import { InternalsView, buildInternalModel } from '/src/engine/boilInternals.ts';

    const params = new URLSearchParams(location.search);
    const pageErrors = [];
    const instances = BOIL_PROCESS.equipment.filter((eq) => BOIL_INTERNALS[eq.modelKey]);
    const modeDefs = OBSERVATION_MODES;
    const DEFAULT_EQ = 'eq-secondary-chamber';
    const eqParam = params.get('eq') || DEFAULT_EQ;
    let current = instances.find((eq) => eq.id === eqParam) || instances.find((eq) => eq.modelKey === eqParam) || instances.find((eq) => eq.id === DEFAULT_EQ) || instances[0];
    let requestedMode = params.get('mode') || 'normal';
    if (!modeDefs.some((m) => m.id === requestedMode)) requestedMode = 'normal';
    let requestedPart = params.get('part') || null;
    let labelsOn = params.get('labels') === '1';
    let animationOn = params.get('anim') !== '0';

    const statusEl = document.getElementById('status');
    const statsEl = document.getElementById('stats');
    const notesEl = document.getElementById('notes');
    const equipmentListEl = document.getElementById('equipmentList');
    const equipmentCountEl = document.getElementById('equipmentCount');
    const modeListEl = document.getElementById('modeList');
    const treeEl = document.getElementById('partTree');
    const detailEl = document.getElementById('detail');
    const labelsToggle = document.getElementById('labelsToggle');
    const animToggle = document.getElementById('animToggle');

    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    // 场景
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d141c);
    scene.fog = new THREE.Fog(0x0d141c, 40, 140);
    const canvas = document.getElementById('view');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.localClippingEnabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = true;

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 500);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    scene.add(new THREE.HemisphereLight(0xbfd6ff, 0x2a3038, 1.2));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.3);
    keyLight.position.set(14, 22, 16);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 120;
    keyLight.shadow.camera.left = -25;
    keyLight.shadow.camera.right = 25;
    keyLight.shadow.camera.top = 25;
    keyLight.shadow.camera.bottom = -25;
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x88aaff, 0.55);
    fillLight.position.set(-18, 12, -16);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(0xffd7a0, 0.35);
    rimLight.position.set(0, 8, -26);
    scene.add(rimLight);

    const grid = new THREE.GridHelper(60, 60, 0x33465a, 0x223041);
    grid.position.y = -0.02;
    scene.add(grid);

    const labelRoot = new THREE.Group();
    scene.add(labelRoot);

    let view = null;
    let selectedPartId = null;
    let partLabels = new Map();
    let selectedLabel = null;
    let mode = requestedMode;

    function makeLabel(text, color = '#d7e2ee', scale = 1) {
      const pad = 16;
      const font = 44;
      const measure = document.createElement('canvas').getContext('2d');
      measure.font = `600 ${font}px "Microsoft YaHei", sans-serif`;
      const width = Math.ceil(measure.measureText(text).width + pad * 2);
      const c = document.createElement('canvas');
      c.width = width;
      c.height = font + pad * 2;
      const ctx = c.getContext('2d');
      ctx.font = `600 ${font}px "Microsoft YaHei", sans-serif`;
      ctx.fillStyle = 'rgba(8, 14, 21, .8)';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = color;
      ctx.textBaseline = 'middle';
      ctx.fillText(text, pad, c.height / 2);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }));
      sprite.scale.set((c.width / c.height) * 0.46 * scale, 0.46 * scale, 1);
      sprite.userData.aspect = c.width / c.height;
      sprite.renderOrder = 40;
      return sprite;
    }

    function equipmentSize() {
      const box = new THREE.Box3().setFromObject(view.build.group);
      const size = box.getSize(new THREE.Vector3());
      return Math.max(size.x, size.y, size.z, 3);
    }

    function createPartLabels() {
      partLabels = new Map();
      const scale = Math.min(1.4, Math.max(0.55, equipmentSize() / 12));
      let index = 0;
      for (const [id, record] of view.build.parts) {
        if (id === view.build.shellPartId) continue;
        const label = makeLabel(record.def.name, record.def.status === 'pending-confirmation' ? '#e8c07a' : '#d7e2ee', scale);
        const lift = 0.3 + (index % 3) * 0.22;
        const lateral = index % 2 === 0 ? 0.16 : -0.16;
        label.position.copy(record.center).add(new THREE.Vector3(lateral, lift, 0));
        label.userData.screenHeight = 0.017;
        labelRoot.add(label);
        partLabels.set(id, label);
        index += 1;
      }
      selectedLabel = makeLabel('', '#8fe3ff', scale * 1.08);
      selectedLabel.visible = false;
      selectedLabel.userData.screenHeight = 0.023;
      selectedLabel.renderOrder = 41;
      labelRoot.add(selectedLabel);
      updateLabelVisibility();
    }

    function disposeSprite(sprite) {
      labelRoot.remove(sprite);
      if (sprite.material?.map) sprite.material.map.dispose();
      if (sprite.material) sprite.material.dispose();
    }

    function updateLabelVisibility() {
      const show = labelsOn && mode !== 'normal';
      const labeledKinds = new Set(['liner', 'drive', 'gun', 'duct']);
      for (const [id, label] of partLabels) {
        const def = view?.build.parts.get(id)?.def;
        label.visible = show && id !== selectedPartId && Boolean(def && labeledKinds.has(def.kind));
      }
      if (selectedLabel) {
        const record = selectedPartId ? view?.build.parts.get(selectedPartId) : null;
        selectedLabel.visible = Boolean(record) && mode !== 'normal';
        if (record) {
          const def = record.def;
          selectedLabel.position.copy(record.center).add(new THREE.Vector3(0, 0.72, 0));
          const expected = `${def.name}${def.status === 'pending-confirmation' ? ' · 待确认' : ''}`;
          if (selectedLabel.userData.text !== expected) {
            disposeSprite(selectedLabel);
            const scale = Math.min(1.4, Math.max(0.55, equipmentSize() / 12));
            const fresh = makeLabel(expected, '#8fe3ff', scale * 1.08);
            fresh.position.copy(record.center).add(new THREE.Vector3(0, 0.72, 0));
            fresh.renderOrder = 41;
            fresh.userData.screenHeight = 0.023;
            fresh.userData.text = expected;
            labelRoot.add(fresh);
            selectedLabel = fresh;
          }
        }
      }
    }

    function updateLabelSizes() {
      const point = new THREE.Vector3();
      const size = (sprite) => {
        if (!sprite.visible) return;
        sprite.getWorldPosition(point);
        const distance = camera.position.distanceTo(point);
        const height = Math.max(0.05, distance * (sprite.userData.screenHeight || 0.018));
        sprite.scale.set(height * (sprite.userData.aspect || 4), height, 1);
      };
      for (const label of partLabels.values()) size(label);
      if (selectedLabel) size(selectedLabel);
    }

    function updateNotes() {
      const def = BOIL_INTERNALS[current.modelKey];
      const activeMode = modeDefs.find((m) => m.id === mode);
      notesEl.innerHTML = `
        <p><strong style="color:#c6d5e5">${def.name} · 教学内部结构</strong>：${def.summary}</p>
        <p>${def.boundaryNote}</p>
        <p class="muted">当前模式（${activeMode?.label ?? mode}）：${activeMode?.note ?? ''}</p>
        <p class="muted">剖切为真实几何裁剪，裁剪面未做封口填充；X 射线为线框幽灵显示，不是射线检测。</p>
        <p class="muted">四根喷枪在流程数据中仍为待确认独立设备；预览中的布置仅为教学示意。</p>
      `;
    }

    function updateStats() {
      if (!view) return;
      let meshes = 0;
      for (const record of view.build.parts.values()) meshes += record.meshes.length;
      const modeInfo = view.modeInfo();
      statsEl.innerHTML = `
        <div><b>${view.build.parts.size}</b> 部件 · <b>${meshes}</b> 网格 · <b>${view.build.shells.length}</b> 外壳网格 · <b>${view.build.animations.length}</b> 教学动画</div>
        <div>模式 <b>${modeInfo.mode}</b> · 外壳 ${modeInfo.shellVisible ? '显示' : '隐藏'} · 内部 ${modeInfo.internalsVisible ? '显示' : '隐藏'} · 裁剪面 ${modeInfo.clippingPlanes}</div>
        <div>${view.build.issues.length ? `<span class="bad">几何缺口 ${view.build.issues.length}</span>` : '<span class="good">数据与几何部件一致</span>'} · 教学示意，不含工程参数</div>
      `;
    }

    function renderEquipmentList() {
      equipmentListEl.innerHTML = '';
      for (const eq of instances) {
        const btn = el('button', '', eq.name);
        btn.dataset.equipmentId = eq.id;
        btn.dataset.modelKey = eq.modelKey;
        if (eq.id === current.id) btn.classList.add('active');
        btn.title = `${eq.id} · 模型 ${eq.modelKey}`;
        const small = el('small', '', eq.modelKey === 'spray-gun' ? '独立支路' : eq.modelKey === 'quench-tower' ? '同型教学模型' : '');
        if (small.textContent) btn.appendChild(small);
        btn.addEventListener('click', () => setEquipment(eq.id));
        equipmentListEl.appendChild(btn);
      }
      equipmentCountEl.textContent = `${instances.length} 个实例 · ${new Set(instances.map((eq) => eq.modelKey)).size} 类模型`;
    }

    function renderModes() {
      modeListEl.innerHTML = '';
      for (const def of modeDefs) {
        const btn = el('button', '', def.label);
        btn.dataset.mode = def.id;
        const small = el('small', '', def.en);
        btn.appendChild(small);
        if (def.id === mode) btn.classList.add('active');
        btn.title = def.note;
        btn.addEventListener('click', () => setMode(def.id));
        modeListEl.appendChild(btn);
      }
    }

    function renderTree() {
      treeEl.innerHTML = '';
      const groups = new Map();
      for (const part of view.build.def.parts) {
        if (!groups.has(part.group)) groups.set(part.group, []);
        groups.get(part.group).push(part);
      }
      for (const [group, parts] of groups) {
        const wrap = el('div', 'tree-group');
        wrap.appendChild(el('span', '', group));
        for (const part of parts) {
          const btn = el('button', 'part-row');
          btn.dataset.partId = part.id;
          if (part.id === selectedPartId) btn.classList.add('active');
          const dot = el('i', `kind ${part.kind}`);
          btn.appendChild(dot);
          btn.appendChild(document.createTextNode(part.name));
          if (part.status === 'pending-confirmation') btn.appendChild(el('span', 'pending', '待确认'));
          btn.title = part.note;
          btn.addEventListener('click', () => selectPart(part.id));
          wrap.appendChild(btn);
        }
        treeEl.appendChild(wrap);
      }
    }

    function updateActiveRows() {
      for (const row of treeEl.querySelectorAll('.part-row')) {
        row.classList.toggle('active', row.dataset.partId === selectedPartId);
      }
      for (const btn of equipmentListEl.querySelectorAll('button')) {
        btn.classList.toggle('active', btn.dataset.equipmentId === current.id);
      }
      for (const btn of modeListEl.querySelectorAll('button')) {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      }
    }

    function renderDetail(def) {
      if (!def) {
        detailEl.innerHTML = '<p class="muted">点击结构树或三维部件查看教学说明。</p>';
        return;
      }
      const status = def.status === 'pending-confirmation' ? '<span class="status">待确认</span>' : '<span class="status ok">教学示意</span>';
      detailEl.innerHTML = `
        <div class="name">${def.name}${status}</div>
        <div class="meta">${DEF_NAME()} · ${def.group} · 部件 id <code>${def.id}</code></div>
        <div class="note">${def.note}</div>
      `;
    }

    function DEF_NAME() {
      return BOIL_INTERNALS[current.modelKey].name;
    }

    function applyViewOffset() {
      camera.setViewOffset(innerWidth, innerHeight, -innerWidth * 0.075, 0, innerWidth, innerHeight);
      camera.updateProjectionMatrix();
    }

    function fitView() {
      if (!view) return;
      const box = new THREE.Box3();
      if (mode === 'internal') box.setFromObject(view.build.internals);
      else box.setFromObject(view.build.group);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const radius = Math.max(size.x, size.y, size.z, 3);
      controls.target.copy(center);
      const distance = mode === 'internal' ? radius * 1.15 : radius * 1.55;
      camera.position.copy(center).add(new THREE.Vector3(distance * 0.78, distance * 0.52, distance * 0.95));
      camera.near = mode === 'internal' ? 0.03 : Math.max(0.05, radius / 240);
      camera.far = Math.max(300, radius * 24);
      applyViewOffset();
      controls.update();
    }

    function loadEquipment(eq) {
      if (view) {
        view.dispose();
        scene.remove(view.build.group);
      }
      for (const label of labelRoot.children.slice()) disposeSprite(label);
      current = eq;
      selectedPartId = null;
      view = new InternalsView(eq.modelKey);
      scene.add(view.build.group);
      view.setAnimationEnabled(animationOn);
      mode = requestedMode;
      view.setMode(mode);
      createPartLabels();
      renderTree();
      renderDetail(null);
      updateNotes();
      fitView();
      updateActiveRows();
      updateStats();
      statusEl.textContent = `渲染完成 · ${eq.name} · ${view.build.parts.size} 部件`;
      requestedMode = mode;
    }

    function selectPart(id) {
      if (!view) return;
      const def = view.selectPart(id);
      if (!def) return;
      selectedPartId = id;
      const record = view.build.parts.get(id);
      if (record && mode === 'normal') {
        mode = 'transparent';
        view.setMode(mode);
        renderModes();
        updateNotes();
        fitView();
      }
      renderDetail(def);
      renderTree();
      updateLabelVisibility();
      updateActiveRows();
      updateStats();
    }

    function setMode(next) {
      if (!view || !modeDefs.some((m) => m.id === next)) return;
      mode = next;
      requestedMode = next;
      view.setMode(mode);
      updateLabelVisibility();
      renderModes();
      updateNotes();
      updateActiveRows();
      fitView();
      updateStats();
    }

    function setEquipment(idOrKey) {
      const eq = instances.find((item) => item.id === idOrKey) || instances.find((item) => item.modelKey === idOrKey);
      if (!eq) return false;
      if (eq.id === current.id && view) return true;
      loadEquipment(eq);
      return true;
    }

    function setLabels(on) {
      labelsOn = Boolean(on);
      if (labelsToggle) labelsToggle.checked = labelsOn;
      updateLabelVisibility();
    }

    function setAnimation(on) {
      animationOn = Boolean(on);
      if (animToggle) animToggle.checked = animationOn;
      if (view) view.setAnimationEnabled(animationOn);
    }

    function resetView() {
      fitView();
    }

    function projectPart(id) {
      if (!view) return null;
      const record = view.build.parts.get(id);
      if (!record) return null;
      const point = record.center.clone().project(camera);
      return {
        x: (point.x * 0.5 + 0.5) * innerWidth,
        y: (-point.y * 0.5 + 0.5) * innerHeight,
        ndcZ: point.z
      };
    }

    function pickAt(x, y) {
      if (!view) return null;
      const ndc = new THREE.Vector2((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(ndc, camera);
      return view.pick(raycaster);
    }

    let audited = null;
    function auditAll() {
      if (audited) return audited;
      const mismatches = [];
      const issues = [];
      let totalParts = 0;
      let totalMeshes = 0;
      for (const key of Object.keys(BOIL_INTERNALS)) {
        const def = BOIL_INTERNALS[key];
        let built;
        try {
          built = buildInternalModel(key);
        } catch (err) {
          mismatches.push({ key, error: String(err) });
          continue;
        }
        totalParts += built.parts.size;
        for (const record of built.parts.values()) totalMeshes += record.meshes.length;
        const dataIds = def.parts.map((p) => p.id).sort();
        const geomIds = [...built.parts.keys()].sort();
        if (dataIds.join('|') !== geomIds.join('|')) {
          mismatches.push({
            key,
            missing: dataIds.filter((id) => !geomIds.includes(id)),
            extra: geomIds.filter((id) => !dataIds.includes(id))
          });
        }
        if (built.issues.length) issues.push(...built.issues);
      }
      audited = { models: Object.keys(BOIL_INTERNALS).length, mismatches, issues, totalParts, totalMeshes };
      return audited;
    }

    function state() {
      if (!view) return { ready: false };
      const info = view.modeInfo();
      const detail = selectedPartId ? view.build.parts.get(selectedPartId)?.def ?? null : null;
      return {
        ready: true,
        mode,
        modeInfo: info,
        equipment: { id: current.id, name: current.name, modelKey: current.modelKey },
        equipmentList: instances.map((eq) => ({ id: eq.id, name: eq.name, modelKey: eq.modelKey })),
        modes: modeDefs.map((m) => ({ id: m.id, label: m.label, en: m.en })),
        parts: view.build.def.parts.map((p) => {
          const record = view.build.parts.get(p.id);
          return { id: p.id, name: p.name, kind: p.kind, group: p.group, status: p.status, meshes: record ? record.meshes.length : 0 };
        }),
        counts: {
          parts: view.build.parts.size,
          shells: view.build.shells.length,
          animations: view.build.animations.length,
          issues: view.build.issues.length,
          labels: partLabels.size
        },
        selectedPart: selectedPartId,
        selectedDetail: detail ? { id: detail.id, name: detail.name, note: detail.note, status: detail.status } : null,
        labels: { on: labelsOn, visible: [...partLabels.values()].filter((l) => l.visible).length },
        animation: { enabled: animationOn, snapshot: view.animationSnapshot() },
        gunPartIds: view.build.def.parts.filter((p) => p.kind === 'gun').map((p) => p.id),
        data: { models: Object.keys(BOIL_INTERNALS).length, modes: modeDefs.length },
        audit: auditAll(),
        pageErrors
      };
    }

    // 交互
    let pointerDown = null;
    renderer.domElement.addEventListener('pointerdown', (event) => {
      pointerDown = { x: event.clientX, y: event.clientY };
    });
    renderer.domElement.addEventListener('pointerup', (event) => {
      if (!pointerDown) return;
      const moved = Math.hypot(event.clientX - pointerDown.x, event.clientY - pointerDown.y);
      pointerDown = null;
      if (moved > 6) return;
      const id = pickAt(event.clientX, event.clientY);
      if (id) selectPart(id);
    });

    labelsToggle.checked = labelsOn;
    labelsToggle.addEventListener('change', () => setLabels(labelsToggle.checked));
    animToggle.checked = animationOn;
    animToggle.addEventListener('change', () => setAnimation(animToggle.checked));
    document.getElementById('resetView').addEventListener('click', resetView);

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      applyViewOffset();
      renderer.setSize(innerWidth, innerHeight);
    });

    addEventListener('error', (event) => pageErrors.push(String(event.message || event.error || 'error')));
    addEventListener('unhandledrejection', (event) => pageErrors.push(String(event.reason || 'rejection')));

    renderEquipmentList();
    renderModes();
    loadEquipment(current);
    if (requestedPart) selectPart(requestedPart);

    let frames = 0;
    function tick(now) {
      if (view) view.update(now || performance.now());
      updateLabelSizes();
      controls.update();
      renderer.render(scene, camera);
      frames += 1;
      if (frames === 4) {
        statusEl.textContent = `渲染完成 · ${current.name} · ${view.build.parts.size} 部件`;
        document.body.dataset.previewReady = '1';
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    window.__boilInternals = {
      get ready() { return Boolean(view); },
      getState: () => state(),
      get mode() { return mode; },
      get equipment() { return { id: current.id, name: current.name, modelKey: current.modelKey }; },
      setMode,
      setEquipment,
      selectPart,
      selectGun: (n) => selectPart(`gun-${n}`),
      setLabels,
      setAnimation,
      resetView,
      projectPart,
      pickAt,
      audit: auditAll,
      frames: () => frames
    };
  </script>
</body>
</html>
