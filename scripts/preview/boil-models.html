<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>微沸喷烧 Phase 2 · 设备接口预览</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1620; color: #d7e2ee; }
    body { font: 13px/1.5 "Microsoft YaHei", system-ui, sans-serif; }
    #view { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; left: 16px; top: 16px; max-width: 430px; max-height: calc(100vh - 32px);
      overflow: auto; padding: 14px 16px; border: 1px solid rgba(120, 160, 200, .35);
      border-radius: 10px; background: rgba(9, 16, 24, .82); backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
    #hud h1 { margin: 0 0 6px; font-size: 16px; letter-spacing: .02em; color: #f0f6fc; }
    #hud p { margin: 4px 0; color: #9fb1c4; }
    #hud .warn { color: #e0b86a; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0 6px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; color: #b9c9da; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .dot.in { background: #64d99a; }
    .dot.out { background: #f0b45a; }
    .dot.boundary { background: #9aa6b2; }
    .dot.pending { background: #d8739a; }
    #summary { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(120, 160, 200, .22); }
    table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12px; }
    th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid rgba(120, 160, 200, .14); }
    th { color: #8fa6bc; font-weight: 500; }
    code { color: #cfe1f3; }
    #status { position: fixed; right: 16px; bottom: 14px; padding: 6px 10px; border-radius: 6px; background: rgba(9, 16, 24, .8); color: #9fb1c4; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">
    <h1>微沸喷烧 Phase 2 · 设备接口与连接关系</h1>
    <p>14 类外部教学模型 · 18 个设备实例 · 36 个数据接口</p>
    <p class="warn">内部验证预览，未接入站点路由；模型比例为教学示意，接口位置不是工程坐标或制造尺寸。</p>
    <div class="legend">
      <span><i class="dot in"></i>入口</span>
      <span><i class="dot out"></i>出口</span>
      <span><i class="dot boundary"></i>流程边界</span>
      <span><i class="dot pending"></i>待确认连接</span>
    </div>
    <div id="summary"></div>
  </div>
  <div id="status">加载中…</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { BOIL_MODELS, BOIL_MODEL_KEYS, buildBoilModel } from '/src/engine/boilModels.ts';
    import { BOIL_PROCESS } from '/src/data/boilProcess.ts';

    const params = new URLSearchParams(location.search);
    const only = params.get('model');
    const showPorts = params.get('ports') !== '0';
    const keys = only ? [only] : BOIL_MODEL_KEYS;
    const errors = [];
    const statusEl = document.getElementById('status');
    const summaryEl = document.getElementById('summary');

    if (only && !BOIL_MODELS[only]) {
      errors.push(`未注册的模型：${only}`);
      statusEl.textContent = errors[0];
      window.__boilPreview = { ready: false, errors };
      throw new Error(errors[0]);
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e1620);
    scene.fog = new THREE.Fog(0x0e1620, 55, 155);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 500);
    const canvas = document.getElementById('view');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    scene.add(new THREE.HemisphereLight(0xbfd6ff, 0x2a3038, 1.15));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
    keyLight.position.set(14, 22, 12);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x88aaff, 0.75);
    fillLight.position.set(-12, 9, -14);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(0xffd7a0, 0.45);
    rimLight.position.set(0, 6, -20);
    scene.add(rimLight);

    const grid = new THREE.GridHelper(150, 75, 0x3a4c60, 0x263342);
    grid.position.y = -0.01;
    scene.add(grid);

    const pendingInstanceKeys = new Set(
      BOIL_PROCESS.equipment.filter((e) => e.dataStatus === 'pending-confirmation').map((e) => e.id)
    );
    const portColor = (p, pending) => {
      if (pending) return 0xd8739a;
      if (p.boundary) return 0x9aa6b2;
      return p.role === 'in' ? 0x64d99a : 0xf0b45a;
    };

    function makeLabel(text, color = '#d7e2ee', scale = 1) {
      const pad = 16;
      const font = 44;
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      ctx.font = `600 ${font}px "Microsoft YaHei", sans-serif`;
      const width = Math.ceil(ctx.measureText(text).width + pad * 2);
      c.width = width;
      c.height = font + pad * 2;
      const ctx2 = c.getContext('2d');
      ctx2.font = `600 ${font}px "Microsoft YaHei", sans-serif`;
      ctx2.fillStyle = 'rgba(8, 14, 21, .72)';
      ctx2.fillRect(0, 0, c.width, c.height);
      ctx2.fillStyle = color;
      ctx2.textBaseline = 'middle';
      ctx2.fillText(text, pad, c.height / 2);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      const material = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set((c.width / c.height) * 0.52 * scale, 0.52 * scale, 1);
      sprite.renderOrder = 20;
      return sprite;
    }

    function addPortMarkers(model, ports, pending, withLabels) {
      if (!showPorts) return;
      const sphereGeo = new THREE.SphereGeometry(0.105, 10, 8);
      const up = new THREE.Vector3(0, 1, 0);
      for (const p of ports) {
        const color = portColor(p, pending);
        const material = new THREE.MeshBasicMaterial({ color, depthTest: false });
        const marker = new THREE.Mesh(sphereGeo, material);
        marker.position.set(p.pos[0], p.pos[1], p.pos[2]);
        marker.renderOrder = 11;
        marker.userData.portMarker = true;
        model.add(marker);

        const dir = new THREE.Vector3(p.dir[0], p.dir[1], p.dir[2]).normalize();
        const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.22, 8), material);
        arrow.position.copy(marker.position).addScaledVector(dir, 0.26);
        arrow.quaternion.setFromUnitVectors(up, dir);
        arrow.renderOrder = 11;
        arrow.userData.portMarker = true;
        model.add(arrow);

        if (withLabels) {
          const label = makeLabel(p.id, '#e8f2fb', 0.82);
          label.position.copy(marker.position).addScaledVector(dir, 0.62).add(new THREE.Vector3(0, 0.16, 0));
          label.userData.portMarker = true;
          model.add(label);
        }
      }
    }

    const modelReports = [];
    const wrappers = [];
    const cols = only ? 1 : 5;
    const spacing = 12;
    keys.forEach((key, index) => {
      const def = BOIL_MODELS[key];
      const pending = BOIL_PROCESS.equipment.some((e) => e.modelKey === key && pendingInstanceKeys.has(e.id));
      const wrapper = new THREE.Group();
      const model = buildBoilModel(key);
      const rawBox = new THREE.Box3().setFromObject(model);
      const center = rawBox.getCenter(new THREE.Vector3());
      const meshCount = (() => { let n = 0; model.traverse((o) => { if (o.isMesh) n += 1; }); return n; })();
      model.position.set(-center.x, -rawBox.min.y, -center.z);
      wrapper.add(model);

      const box = new THREE.Box3().setFromObject(wrapper);
      const size = box.getSize(new THREE.Vector3());
      addPortMarkers(model, def.ports, pending, Boolean(only));
      if (!only) {
        const label = makeLabel(`${def.name} · ${key}`, '#f0f6fc', 1.05);
        label.position.set(0, box.max.y + 0.75, 0);
        wrapper.add(label);
      }

      const col = index % cols;
      const row = Math.floor(index / cols);
      wrapper.position.set((col - (cols - 1) / 2) * spacing, 0, (row - 1) * spacing);
      scene.add(wrapper);
      wrappers.push(wrapper);

      const portReports = def.ports.map((p) => {
        const local = new THREE.Vector3(p.pos[0], p.pos[1], p.pos[2]).add(model.position);
        const inside = local.x >= box.min.x - 0.65 && local.x <= box.max.x + 0.65 &&
          local.y >= box.min.y - 0.65 && local.y <= box.max.y + 0.65 &&
          local.z >= box.min.z - 0.65 && local.z <= box.max.z + 0.65;
        return {
          id: p.id,
          name: p.name,
          role: p.role,
          media: p.media,
          size: p.size,
          boundary: Boolean(p.boundary),
          pos: [Number(local.x.toFixed(3)), Number(local.y.toFixed(3)), Number(local.z.toFixed(3))],
          dir: p.dir,
          insideTolerance: inside
        };
      });

      modelReports.push({
        key,
        name: def.name,
        note: def.note,
        pendingInstance: pending,
        bbox: {
          min: [Number(box.min.x.toFixed(3)), Number(box.min.y.toFixed(3)), Number(box.min.z.toFixed(3))],
          max: [Number(box.max.x.toFixed(3)), Number(box.max.y.toFixed(3)), Number(box.max.z.toFixed(3))],
          size: [Number(size.x.toFixed(3)), Number(size.y.toFixed(3)), Number(size.z.toFixed(3))]
        },
        meshCount,
        portCount: def.ports.length,
        ports: portReports
      });
    });

    const totalModelPorts = modelReports.reduce((sum, m) => sum + m.portCount, 0);
    const dataPorts = BOIL_PROCESS.equipment.reduce((sum, e) => sum + e.ports.length, 0);
    const instances = BOIL_PROCESS.equipment.map((e) => ({
      id: e.id,
      name: e.name,
      modelKey: e.modelKey,
      modelStatus: e.modelStatus,
      dataStatus: e.dataStatus,
      ports: e.ports.map((p) => ({
        id: p.id,
        modelPortId: p.modelPortId ?? p.id,
        role: p.role,
        media: p.media,
        dataStatus: p.dataStatus,
        boundary: Boolean(p.boundary)
      }))
    }));

    summaryEl.innerHTML = `
      <div><strong>${keys.length}</strong> 个模型 · <strong>${totalModelPorts}</strong> 个模型接口 · <strong>${dataPorts}</strong> 个数据接口</div>
      <div>实例映射：18 个设备实例 → 14 类模型</div>
      <table>
        <thead><tr><th>模型</th><th>外形（教学）</th><th>接口</th></tr></thead>
        <tbody>
          ${modelReports.map((m) => `<tr><td><code>${m.key}</code></td><td>${m.bbox.size[0]} × ${m.bbox.size[1]} × ${m.bbox.size[2]} m</td><td>${m.ports.map((p) => p.id).join(', ')}</td></tr>`).join('')}
        </tbody>
      </table>
      ${only ? `<p style="margin-top:8px">当前仅显示 <code>${only}</code>；数据实例：${instances.filter((e) => e.modelKey === only).map((e) => e.name).join('、') || '无'}</p>` : '<p style="margin-top:8px">按 <code>?model=模型键</code> 可单独查看；按 <code>?ports=0</code> 可隐藏接口标记。</p>'}
    `;

    const allBox = new THREE.Box3();
    wrappers.forEach((w) => allBox.expandByObject(w));
    const center = allBox.getCenter(new THREE.Vector3());
    const size = allBox.getSize(new THREE.Vector3());
    const radius = Math.max(size.x, size.y, size.z);
    const hudShift = size.x * (only ? 0.16 : 0.05);
    const target = center.clone().add(new THREE.Vector3(-hudShift, size.y * 0.05, 0));
    const distance = radius * (only ? 1.55 : 1.2);
    controls.target.copy(target);
    camera.position.copy(target).add(new THREE.Vector3(distance * 0.55, distance * 0.45, distance * 0.9));
    controls.update();

    let frames = 0;
    function tick() {
      controls.update();
      renderer.render(scene, camera);
      frames += 1;
      if (frames === 3) {
        statusEl.textContent = `渲染完成 · ${modelReports.length} 个模型 · ${totalModelPorts} 个模型接口`;
        window.__boilPreview = {
          ready: true,
          mode: only ? 'single' : 'overview',
          modelCount: modelReports.length,
          modelKeys: modelReports.map((m) => m.key),
          modelPortTotal: totalModelPorts,
          dataPortCount: dataPorts,
          models: modelReports,
          instances,
          errors
        };
        document.body.dataset.previewReady = '1';
      }
      requestAnimationFrame(tick);
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    tick();
  </script>
</body>
</html>
