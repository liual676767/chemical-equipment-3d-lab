<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>微沸喷烧 Phase 3 · 工业管道教学示意预览</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d141c; color: #d7e2ee; }
    body { font: 13px/1.5 "Microsoft YaHei", system-ui, sans-serif; }
    #view { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; left: 16px; top: 16px; width: 460px; max-height: calc(100vh - 32px);
      overflow: auto; padding: 14px 16px; border: 1px solid rgba(120, 160, 200, .35);
      border-radius: 10px; background: rgba(8, 14, 21, .86); backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
    }
    #hud h1 { margin: 0 0 4px; font-size: 16px; letter-spacing: .02em; color: #f0f6fc; }
    #hud h2 { margin: 12px 0 4px; font-size: 13px; color: #9fb8d0; font-weight: 600; }
    #hud p { margin: 4px 0; color: #9fb1c4; }
    #hud .warn { color: #e0b86a; }
    #hud .bad { color: #e88484; }
    #hud .good { color: #7fd8a3; }
    table { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 11.5px; }
    th, td { text-align: left; padding: 2px 5px; border-bottom: 1px solid rgba(120, 160, 200, .14); vertical-align: top; }
    th { color: #8fa6bc; font-weight: 500; }
    code { color: #cfe1f3; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
    .chip { padding: 1px 7px; border-radius: 999px; border: 1px solid rgba(120, 160, 200, .3); color: #b9c9da; font-size: 11.5px; }
    #status { position: fixed; right: 16px; bottom: 14px; padding: 6px 10px; border-radius: 6px; background: rgba(8, 14, 21, .82); color: #9fb1c4; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 4px; color: #b9c9da; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .dot.material { background: #3f7fbf; }
    .dot.gas { background: #8a95a3; }
    .dot.boundary { background: #9aa6b2; }
    .dot.pending { background: #d8739a; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">
    <h1>微沸喷烧 Phase 3 · 工业管道教学示意</h1>
    <p>18 个设备实例 · 13 条管线 · 正交路由 + 穿模检查 + 部件库</p>
    <p class="warn">内部验证预览，未接入站点路由；设备布局、管线走向、阀门型式/位置与支架均为教学示意，不是工程坐标或管道设计。</p>
    <div class="legend">
      <span><i class="dot material"></i>物料流</span>
      <span><i class="dot gas"></i>烟气流</span>
      <span><i class="dot boundary"></i>流程边界</span>
      <span><i class="dot pending"></i>待确认接口</span>
    </div>
    <div id="summary"></div>
  </div>
  <div id="status">加载中…</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { BOIL_MODELS, BOIL_MODEL_KEYS, buildBoilModel, getBoilModelBounds } from '/src/engine/boilModels.ts';
    import { BOIL_PROCESS } from '/src/data/boilProcess.ts';
    import { BOIL_LAYOUT, BOIL_KEEPOUTS, BOIL_LAYOUT_NOTE } from '/src/data/boilLayout.ts';
    import { validatePiping, BOIL_PIPE_SIZES } from '/src/process/piping.ts';
    import { buildPipingRoutes, buildPipingGallery, BOIL_GALLERY_ITEMS } from '/src/engine/boilPiping.ts';

    const params = new URLSearchParams(location.search);
    const galleryMode = params.get('gallery') === '1';
    const focusPipe = params.get('pipe');
    const errors = [];
    const statusEl = document.getElementById('status');
    const summaryEl = document.getElementById('summary');

    const modelSpecs = {};
    for (const key of BOIL_MODEL_KEYS) {
      modelSpecs[key] = {
        key,
        bbox: getBoilModelBounds(key),
        ports: BOIL_MODELS[key].ports.map((port) => ({
          id: port.id,
          pos: port.pos,
          dir: port.dir,
          size: port.size,
          role: port.role,
          media: port.media,
          boundary: port.boundary
        }))
      };
    }
    const piping = validatePiping(BOIL_PROCESS, (key) => modelSpecs[key], {}, BOIL_LAYOUT, BOIL_KEEPOUTS);
    if (piping.errors.length > 0) errors.push(...piping.errors.map((e) => `[${e.code}] ${e.message}`));
    const mediumColors = Object.fromEntries(BOIL_PROCESS.media.map((m) => [m.id, m.color]));
    const mediumLabels = Object.fromEntries(BOIL_PROCESS.media.map((m) => [m.id, m.label]));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d141c);
    scene.fog = new THREE.Fog(0x0d141c, 120, 320);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 800);
    const canvas = document.getElementById('view');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    scene.add(new THREE.HemisphereLight(0xbfd6ff, 0x2a3038, 1.15));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.35);
    keyLight.position.set(30, 48, 26);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 220;
    keyLight.shadow.camera.left = -70;
    keyLight.shadow.camera.right = 70;
    keyLight.shadow.camera.top = 60;
    keyLight.shadow.camera.bottom = -60;
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x88aaff, 0.7);
    fillLight.position.set(-40, 24, -30);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(0xffd7a0, 0.4);
    rimLight.position.set(0, 18, -60);
    scene.add(rimLight);

    const grid = new THREE.GridHelper(150, 75, 0x3a4c60, 0x263342);
    grid.position.set(40, -0.01, 0);
    scene.add(grid);

    function makeLabel(text, color = '#d7e2ee', scale = 1) {
      const pad = 16;
      const font = 44;
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      ctx.font = `600 ${font}px "Microsoft YaHei", sans-serif`;
      const width = Math.ceil(ctx.measureText(text).width + pad * 2);
      c.width = width;
      c.height = font + pad * 2;
      const ctx2 = c.getContext('2d');
      ctx2.font = `600 ${font}px "Microsoft YaHei", sans-serif`;
      ctx2.fillStyle = 'rgba(8, 14, 21, .78)';
      ctx2.fillRect(0, 0, c.width, c.height);
      ctx2.fillStyle = color;
      ctx2.textBaseline = 'middle';
      ctx2.fillText(text, pad, c.height / 2);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      const material = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set((c.width / c.height) * 0.5 * scale, 0.5 * scale, 1);
      sprite.renderOrder = 20;
      return sprite;
    }

    const root = new THREE.Group();
    scene.add(root);
    const labelRoot = new THREE.Group();
    scene.add(labelRoot);

    let pipingBuild = null;
    let galleryBuild = null;
    let mode = galleryMode ? 'gallery' : focusPipe ? 'focus' : 'overview';

    if (galleryMode) {
      galleryBuild = buildPipingGallery();
      root.add(galleryBuild.group);
      for (const item of BOIL_GALLERY_ITEMS) {
        const label = makeLabel(item.label, '#e8f2fb', 0.52);
        const lift = item.key === 'support' ? 2.35 : 1.55;
        label.position.set(item.position[0], item.position[1] + lift, item.position[2]);
        labelRoot.add(label);
      }
    } else {
      const equipmentRoot = new THREE.Group();
      for (const eq of piping.world.equipment) {
        const model = buildBoilModel(eq.modelKey);
        model.position.set(eq.modelOffset[0], eq.modelOffset[1], eq.modelOffset[2]);
        const holder = new THREE.Group();
        holder.position.set(eq.position[0], eq.position[1], eq.position[2]);
        holder.rotation.y = eq.rotationY;
        holder.userData.equipmentId = eq.equipmentId;
        holder.add(model);
        equipmentRoot.add(holder);

        const label = makeLabel(`${eq.name} · ${eq.equipmentId}`, '#f0f6fc', 0.92);
        label.position.set(
          (eq.modelBox.min[0] + eq.modelBox.max[0]) / 2,
          eq.modelBox.max[1] + 0.7,
          (eq.modelBox.min[2] + eq.modelBox.max[2]) / 2
        );
        labelRoot.add(label);
      }
      root.add(equipmentRoot);

      pipingBuild = buildPipingRoutes(piping.routes, mediumColors);
      root.add(pipingBuild.group);

      const connected = new Set();
      for (const route of piping.routes) {
        connected.add(route.fromPortKey);
        connected.add(route.toPortKey);
      }
      const up = new THREE.Vector3(0, 1, 0);
      for (const port of piping.world.ports) {
        const key = `${port.equipmentId}.${port.portId}`;
        if (connected.has(key)) continue;
        const color = port.boundary ? 0x9aa6b2 : 0xd8739a;
        const material = new THREE.MeshBasicMaterial({ color, depthTest: false });
        const marker = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 8), material);
        marker.position.set(port.world[0], port.world[1], port.world[2]);
        marker.renderOrder = 11;
        labelRoot.add(marker);
        const dir = new THREE.Vector3(port.dir[0], port.dir[1], port.dir[2]).normalize();
        const label = makeLabel(
          `${port.equipmentName} · ${port.portId} ${port.boundary ? '边界' : '待确认'}`,
          port.boundary ? '#c3ccd6' : '#f0a6c0',
          0.78
        );
        label.position.set(
          port.world[0] + dir.x * 0.55,
          port.world[1] + dir.y * 0.55 + 0.2,
          port.world[2] + dir.z * 0.55
        );
        labelRoot.add(label);
      }

      for (const route of piping.routes) {
        let best = null;
        for (const seg of route.segments) {
          if (!best || seg.length > best.length) best = seg;
        }
        if (!best) continue;
        const mid = [
          (best.from[0] + best.to[0]) / 2,
          (best.from[1] + best.to[1]) / 2,
          (best.from[2] + best.to[2]) / 2
        ];
        const label = makeLabel(`${route.pipelineId} · ${BOIL_PIPE_SIZES[route.size].label}`, '#dfeaf5', 0.8);
        label.position.set(mid[0], mid[1] + 0.4, mid[2]);
        label.userData.pipelineLabel = route.pipelineId;
        labelRoot.add(label);
      }

      if (focusPipe) {
        const focusGroup = pipingBuild.pipelines.find((group) => group.userData.pipelineId === focusPipe);
        if (!focusGroup) errors.push(`聚焦管线不存在：${focusPipe}`);
        else {
          for (const group of pipingBuild.pipelines) {
            if (group !== focusGroup) group.visible = false;
          }
          for (const label of [...labelRoot.children]) {
            label.visible = label.userData.pipelineLabel === focusPipe;
          }
        }
      }
    }

    const sizingBox = new THREE.Box3();
    if (galleryMode) {
      sizingBox.setFromObject(galleryBuild.group);
    } else if (focusPipe) {
      const focusGroup = pipingBuild.pipelines.find((group) => group.userData.pipelineId === focusPipe);
      if (focusGroup) sizingBox.setFromObject(focusGroup);
      else sizingBox.setFromObject(root);
    } else {
      sizingBox.setFromObject(root);
    }
    const center = sizingBox.getCenter(new THREE.Vector3());
    const size = sizingBox.getSize(new THREE.Vector3());
    const radius = Math.max(size.x, size.y, size.z, 8);
    if (galleryMode) {
      controls.target.set(center.x - 3.2, 1.0, center.z);
      camera.position.set(center.x - 3.2, 7.5, center.z + 18);
      camera.near = 0.1;
      camera.far = 200;
    } else {
      const target = center.clone();
      target.x -= size.x * (focusPipe ? 0.05 : 0.075);
      const distanceFactor = focusPipe ? 2.2 : 0.82;
      controls.target.copy(target);
      camera.position.copy(target).add(new THREE.Vector3(
        radius * 0.52 * distanceFactor,
        radius * 0.42 * distanceFactor,
        radius * 0.92 * distanceFactor
      ));
      camera.near = Math.max(0.08, radius / 400);
      camera.far = Math.max(600, radius * 9);
    }
    camera.updateProjectionMatrix();
    controls.update();

    const routeRows = piping.routes.map((route) => {
      const valve = route.valves[0];
      return `<tr>
        <td><code>${route.pipelineId}</code></td>
        <td>${mediumLabels[route.medium] ?? route.medium}</td>
        <td>${BOIL_PIPE_SIZES[route.size].label}</td>
        <td>${route.length.toFixed(1)} m</td>
        <td>${route.bends.length}</td>
        <td>${valve ? (valve.kind === 'gate' ? '闸阀' : '蝶阀') : '—'}</td>
        <td>${route.supports.length}</td>
      </tr>`;
    }).join('');

    if (galleryMode) {
      summaryEl.innerHTML = `
        <div><strong>部件库模式</strong>：直管 3 档管径 · 弯头 · 三通 · 变径 · 法兰对 · 闸阀 · 蝶阀 · 支架</div>
        <p class="warn">三通/变径只演示几何能力，本流程 13 条管线拓扑无分支/变径需求，工艺管线中未放置。</p>
        <h2>部件库清单</h2>
        <table>
          <thead><tr><th>部件</th><th>说明</th><th>网格数</th></tr></thead>
          <tbody>
            ${BOIL_GALLERY_ITEMS.map((item) => `<tr><td><code>${item.key}</code></td><td>${item.label}</td><td>${galleryBuild.counts[item.key] ?? 0}</td></tr>`).join('')}
          </tbody>
        </table>
      `;
    } else {
      summaryEl.innerHTML = `
        <div><strong>${piping.counts.routedPipelines}</strong> 条管线 · <strong>${piping.counts.terminalFlanges}</strong> 个端部法兰 · <strong>${piping.counts.elbows}</strong> 个弯头 · <strong>${piping.counts.valves}</strong> 个示意阀 · <strong>${piping.counts.supports}</strong> 个支架</div>
        <div>接口：接管 ${piping.counts.connectedPorts} / 边界 ${piping.counts.boundaryPorts} / 待确认 ${piping.counts.pendingPorts}；管径 ${piping.counts.sizesUsed} 类（工艺线全部为主工艺等级）</div>
        <div class="${piping.counts.collisions === 0 && piping.counts.equipmentOverlaps === 0 && piping.counts.supportConflicts === 0 ? 'good' : 'bad'}">穿模 ${piping.counts.collisions} · 设备重叠 ${piping.counts.equipmentOverlaps} · 支架冲突 ${piping.counts.supportConflicts} · 路由总长 ${piping.counts.routeLength.toFixed(1)} m</div>
        <div>三通 ${piping.counts.tees} / 变径 ${piping.counts.reducers}（本流程未放置，见 <code>?gallery=1</code> 部件库）</div>
        <h2>管线台账</h2>
        <table>
          <thead><tr><th>管线</th><th>介质</th><th>管径</th><th>长度</th><th>弯头</th><th>示意阀</th><th>支架</th></tr></thead>
          <tbody>${routeRows}</tbody>
        </table>
        <p style="margin-top:8px">${BOIL_LAYOUT_NOTE}</p>
        ${focusPipe ? `<p class="warn">当前聚焦：<code>${focusPipe}</code>（其余管线隐藏）。</p>` : '<p>按 <code>?pipe=管线id</code> 聚焦单条管线；按 <code>?gallery=1</code> 查看部件库。</p>'}
      `;
    }

    const routeReports = piping.routes.map((route) => ({
      pipelineId: route.pipelineId,
      medium: route.medium,
      size: route.size,
      fromPortKey: route.fromPortKey,
      toPortKey: route.toPortKey,
      length: Number(route.length.toFixed(3)),
      points: route.points,
      segments: route.segments.length,
      elbows: route.bends.length,
      valves: route.valves.length,
      valveKinds: route.valves.map((v) => v.kind),
      supports: route.supports.length,
      flanges: route.terminalFlanges.length
    }));

    let frames = 0;
    function tick() {
      controls.update();
      renderer.render(scene, camera);
      frames += 1;
      if (frames === 3) {
        statusEl.textContent = galleryMode
          ? `渲染完成 · 部件库 ${BOIL_GALLERY_ITEMS.length} 项`
          : `渲染完成 · ${piping.counts.routedPipelines} 条管线 · 穿模 ${piping.counts.collisions}`;
        window.__boilPiping = {
          ready: true,
          mode,
          layoutNote: BOIL_LAYOUT_NOTE,
          counts: piping.counts,
          errorCount: piping.errors.length,
          warningCount: piping.warnings.length,
          errors: piping.errors,
          warnings: piping.warnings,
          routes: routeReports,
          equipment: piping.world.equipment.map((eq) => ({
            equipmentId: eq.equipmentId,
            name: eq.name,
            modelKey: eq.modelKey,
            position: eq.position,
            rotationY: eq.rotationY,
            modelBox: eq.modelBox,
            keepouts: eq.keepouts.length
          })),
          worldPorts: piping.world.ports,
          meshCounts: pipingBuild ? pipingBuild.counts : null,
          pipelineGroups: pipingBuild ? pipingBuild.pipelines.map((g) => g.userData.pipelineId) : [],
          gallery: galleryMode
            ? {
                items: BOIL_GALLERY_ITEMS.map((item) => ({ ...item, meshes: galleryBuild.counts[item.key] ?? 0 })),
                counts: galleryBuild.counts
              }
            : null,
          focusPipe: focusPipe || null,
          pageErrors: errors
        };
        document.body.dataset.previewReady = '1';
      }
      requestAnimationFrame(tick);
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    tick();
  </script>
</body>
</html>
